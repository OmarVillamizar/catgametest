<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cat Runner</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas {
  display: block;
  width: 100vw; height: 100vh;
  object-fit: contain;
  touch-action: none;
  image-rendering: pixelated;
  -webkit-user-select: none;
  user-select: none;
}

#mute-btn {
  position: fixed; top: 8px; right: 8px; width: 30px; height: 30px;
  background: rgba(240,228,216,0.88); border: 2px solid #8B7355; border-radius: 3px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  padding: 3px; z-index: 100; image-rendering: pixelated;
  -webkit-user-select: none; user-select: none;
}
#mute-btn:hover { background: rgba(196,168,130,0.95); }
#mute-btn svg { width: 18px; height: 18px; fill: #4A3728; display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute-btn" title="Toggle sound"></button>
<pre id="debug" style="display:none;position:fixed;top:0;left:0;color:#0f0;font:10px monospace;background:rgba(0,0,0,0.7);padding:4px 8px;z-index:999;pointer-events:none;">loading...</pre>
<script>
(function() {
  'use strict';

  var DEBUG = location.search.includes('debug');
  var drawLog = [];
  var lastFrameDrawLog = [];
  var frameCount = 0;

  function logDraw(part, data) {
    if (!DEBUG) return;
    drawLog.push({ part: part, x: data.x, y: data.y, w: data.w, h: data.h, color: data.color, extra: data.extra });
  }

  // HandleIntent: same logic as keydown, callable from puppeteer
  function handleIntent(intent) {
    switch (intent) {
      case 'start': anyKey = true; break;
      case 'jump': jumpKey = true; anyKey = true; break;
      case 'duck': duckKey = true; anyKey = true; break;
      case 'releaseJump': jumpKey = false; break;
      case 'releaseDuck': duckKey = false; break;
      case 'pause': gameState = gameState === 'PLAYING' ? 'PAUSED' : (gameState === 'PAUSED' ? 'PLAYING' : gameState); break;
      case 'restart': gameState = 'READY'; Game.resetAll(); break;
    }
  }

  // Step one game tick (used by puppeteer tick(n))
  function stepFrame() {
    var dt = FIXED_DT;
    Game.transition();
    if (deathTimer > 0) deathTimer--;
    if (gameState === 'PLAYING') {
      Input.poll();
      Player.update(dt);
      ObstacleManager.update(dt);
      Background.update(dt);
      score += gameSpeed * dt / 10;
      if (invulnTimer > 0) { invulnTimer -= dt; if (invulnTimer < 0) invulnTimer = 0; }
      if (stumbleTimer > 0) stumbleTimer--;
      Game.checkCollisions();
    }
  }

  // Expose debug API
  if (DEBUG) {
    window.__game = {
      snap: function() {
        var obs = ObstacleManager.getActive().map(function(o) {
          var hb = ObstacleManager.getHitbox(o);
          return { type: OBSTACLES[o.type].name, x: o.x, hb: hb };
        });
        return {
          state: gameState, catY: catY, onGround: catOnGround, ducking: catDucking,
          hitbox: Player.getHitbox(),
          obstacles: obs,
          dog: { x: dogX, state: dogState },
          speed: gameSpeed, score: Math.floor(score), frame: frameCount,
          damageCount: damageCount, invulnTimer: invulnTimer, deathTimer: deathTimer,
          windowOffset: windowOffset,
          drawLog: lastFrameDrawLog.slice()
        };
      },
      input: function(intent) { handleIntent(intent); },
      tick: function(n) {
        n = n || 1;
        for (var i = 0; i < n; i++) { stepFrame(); }
      },
      render: function() { Game.renderFrame(); },
      forceGameOver: function() {
        damageCount = 3;
        gameState = 'GAME_OVER';
        deathTimer = 60;
        anyKey = false; jumpKey = false; duckKey = false;
        if (score > highScore) { highScore = Math.floor(score); try { localStorage.setItem('catRunnerHighScore', String(Math.floor(highScore))); } catch(e) {} }
      },
      reset: function() { Game.resetAll(); }
    };
  }

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  // ÔöÇÔöÇ Constants ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
  var W = 800, H = 300;
  canvas.width = W; canvas.height = H;

  var GROUND_Y    = 240;
  var FIXED_DT    = 16.667;
  var DT_CAP      = 100;
  var CAT_X       = 150;
  var JUMP_VEL    = -14;
  var GRAVITY     = 0.85;
  var BASE_SPEED  = 3;
  var SPEED_RAMP  = 0.08;          // ├ù per 10s
  var SPEED_CAP   = 9;             // 3├ù base
  var SPEED_MAX   = 9;
  var INVULN_MS   = 800;
  var BLINK_MS    = 100;
  var MAX_OBSTACLES = 3;
  var SPAWN_MIN   = 1200;          // ms
  var SPAWN_MAX   = 3000;
  var MIN_GAP     = 300;           // px between obstacles
  var DOG_BASE_X  = -40;
  var DOG_POSITIONS = [-40, 30, 78, 160];

  // Obstacle definitions: { name, w, h, short (floating), draw fn }
  var OBSTACLES = [
    { name:'vase',  w:22, h:50, short:false,
      draw:function(ctx,x,y){ ctx.fillStyle='#C8B078'; ctx.fillRect(x+7,y-40,19,40);
        ctx.beginPath(); ctx.ellipse(x+16,y-40,11,6,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#B09860'; ctx.fillRect(x+3,y-8,25,8); } },
    { name:'lamp',  w:18, h:55, short:false,
      draw:function(ctx,x,y){ ctx.fillStyle='#8B6F47'; ctx.fillRect(x+6,y-48,4,48);
        ctx.beginPath(); ctx.arc(x+8,y-2,8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#E8D8A0'; ctx.beginPath(); ctx.moveTo(x+2,y-52); ctx.lineTo(x+14,y-52);
        ctx.lineTo(x+12,y-42); ctx.lineTo(x+4,y-42); ctx.closePath(); ctx.fill(); } },
    { name:'chair', w:35, h:45, short:false,
      draw:function(ctx,x,y){ ctx.fillStyle='#A07848';
        ctx.fillRect(x+2,y-8,4,8); ctx.fillRect(x+29,y-8,4,8);
        ctx.fillRect(x+2,y-45,35,5); ctx.fillRect(x+2,y-45,4,22);
        ctx.fillStyle='#8B6B3E'; ctx.fillRect(x+6,y-12,23,4); } },
    { name:'toy',   w:24, h:30, short:true,
      draw:function(ctx,x,y){ ctx.fillStyle='#E87080';
        ctx.beginPath(); ctx.arc(x+12,y-15,12,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2; ctx.beginPath();
        ctx.arc(x+12,y-15,12,-0.3,1.5); ctx.stroke();
        ctx.fillStyle='#FFF'; ctx.beginPath(); ctx.arc(x+16,y-18,3,0,Math.PI*2); ctx.fill(); } },
    { name:'basket',w:28, h:30, short:true,
      draw:function(ctx,x,y){ ctx.fillStyle='#C49460';
        ctx.beginPath(); ctx.moveTo(x+6,y-12); ctx.lineTo(x+22,y-12);
        ctx.lineTo(x+18,y-26); ctx.lineTo(x+10,y-26); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#A07040'; ctx.lineWidth=1;
        for(var i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+6+i*4,y-12);
          ctx.lineTo(x+8+i*4,y-26); ctx.stroke(); } } },
    { name:'plant', w:30, h:45, short:true,
      draw:function(ctx,x,y){ ctx.fillStyle='#B07040';
        ctx.fillRect(x+8,y-12,14,12);
        ctx.fillStyle='#60A040';
        ctx.beginPath(); ctx.ellipse(x+6,y-18,6,10,-0.3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+24,y-20,7,11,0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+15,y-30,6,12,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+15,y-22,5,8,0,0,Math.PI*2);
        ctx.fillStyle='#80C060'; ctx.fill(); } }
  ];

  // Color palette
  var C = {
    wall:        '#F0E4D8', wallPattern: '#E8D8C8',
    floor:       '#C4A882', floorDark:    '#B89870', floorLine: '#A88868',
    baseboard:   '#8B7355', windowFrame:  '#D4B896', windowGlass: '#B5D8E8',
    catBody:     '#E8923A', catStripe:    '#D47A2A', catBelly: '#F4C478',
    catInnerEar: '#F0B0B0', catEye:       '#2D2D2D', catNose: '#E87080',
    catLeg:      '#D48030', catHighlight: '#FFFFFF',
    dogBody:     '#8B6F47', dogDark:      '#6B5230', dogTongue: '#FF6B6B',
    text:        '#4A3728'
  };

  // ÔöÇÔöÇ Shared State ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
  var gameState    = 'READY';       // READY | PLAYING | PAUSED | GAME_OVER
  var gameSpeed    = BASE_SPEED;
  var floorOffset  = 0;
  var windowOffset = 0;
  var elapsedTime  = 0;            // ms, for speed ramp
  var damageCount  = 0;            // 0-3
  var invulnTimer  = 0;            // ms remaining
  var dogX         = DOG_BASE_X;
  var dogState     = 'idle';       // idle | advancing | lunging
  var stumbleTimer = 0;            // stumble anim frames remaining
  var deathTimer   = 0;            // cooldown frames before restart allowed
  var score        = 0;            // current score
  var highScore    = 0;            // from localStorage
  var introPhase   = 'idle';       // idle | bolting (cat runs to position)
  var introTimer   = 0;            // ms
  var introCatX    = 400;          // cat X during intro
  var introYarnX   = 420;          // yarn ball position
  var introYarnVY  = 0;            // yarn bounce velocity
  var isMobile     = false;        // touch device detection

  // ÔöÇÔöÇ Cat State ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
  var catY        = GROUND_Y;      // feet position in px
  var catVY       = 0;
  var catOnGround = true;
  var catDucking  = false;
  var runFrame    = 0;             // 0-3
  var runTimer    = 0;
  var jumpBuffer  = 0;             // frames remaining for buffered jump
  var RUN_MS      = 100;
  var LEG_OFFSETS = [0, -3, -2, -1];

  // ÔöÇÔöÇ Input State ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
  var jumpKey  = false;
  var duckKey  = false;
  var anyKey   = false;
  var jumpEdge = false;            // rising edge this tick

  var Sound = (function() {
    var bark = new Audio('sounds/bark_dog.mp3');
    var music = new Audio('sounds/music.mp3');
    var muted = false;
    try { muted = localStorage.getItem('catRunnerMuted') === '1'; } catch(e) {}
    bark.preload = 'auto';
    music.preload = 'auto';
    music.loop = true;
    bark.muted = muted;
    music.muted = muted;

    function play(audio) {
      audio.currentTime = 0;
      audio.play().catch(function() {});
    }

    return {
      playBark:    function() { play(bark); },
      toggleMute:  function() { muted = !muted; bark.muted = muted; music.muted = muted; try { localStorage.setItem('catRunnerMuted', muted ? '1' : '0'); } catch(e) {} },
      isMuted:     function() { return muted; },
      playMusic:   function() { music.currentTime = 0; music.play().catch(function(){}); },
      pauseMusic:  function() { music.pause(); },
      resumeMusic: function() { music.play().catch(function(){}); },
      stopMusic:   function() { music.pause(); music.currentTime = 0; }
    };
  })();


  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  //  BACKGROUND module
  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  var Background = (function() {
    var SEGMENT_W = 810;           // 6 planks ├ù 135px
    var PLANK_W = 135, PLANK_H = 60;

    function update(dt) {
      if (gameState !== 'PLAYING') return;
      floorOffset = (floorOffset + gameSpeed * 0.6 * dt / FIXED_DT) % SEGMENT_W;
      windowOffset = (windowOffset + gameSpeed * 0.15 * dt / FIXED_DT) % 900;
    }

    function render(ctx) {
      // Wall
      ctx.fillStyle = C.wall;
      ctx.fillRect(0, 0, W, 232);
      logDraw('bg-wall', {x:0, y:0, w:W, h:232, color:C.wall});
      // Dot pattern
      ctx.fillStyle = C.wallPattern;
      for (var x = 20; x < W; x += 40) {
        for (var y = 20; y < 232; y += 40) {
          ctx.fillRect(x, y, 2, 2);
        }
      }
      // Window (parallax scroll at 0.15x)
      var wx = 620 - windowOffset, wy = 60, ww = 100, wh = 130;
      drawWindow(ctx, wx, wy, ww, wh);
      drawWindow(ctx, wx + 900, wy, ww, wh);
      // Baseboard
      ctx.fillStyle = C.baseboard;
      ctx.fillRect(0, 232, W, 8);
      logDraw('bg-baseboard', {x:0, y:232, w:W, h:8, color:C.baseboard});
      // Floor planks (parallax scroll)
      for (var seg = -1; seg <= 1; seg++) {
        var segX = seg * SEGMENT_W - floorOffset;
        for (var i = 0; i < 6; i++) {
          var px = segX + i * PLANK_W;
          ctx.fillStyle = (i % 2 === 0) ? C.floor : C.floorDark;
          ctx.fillRect(px, GROUND_Y, PLANK_W, PLANK_H);
          ctx.strokeStyle = C.floorLine;
          ctx.lineWidth = 1;
          ctx.strokeRect(px, GROUND_Y, PLANK_W, PLANK_H);
        }
      }
    }

    function reset() {
      floorOffset = 0;
      windowOffset = 0;
    }

    function drawWindow(ctx, wx, wy, ww, wh) {
      ctx.fillStyle = C.windowFrame;
      ctx.fillRect(wx, wy, ww, wh);
      ctx.fillStyle = C.windowGlass;
      ctx.fillRect(wx + 8, wy + 8, ww - 16, wh - 16);
      ctx.strokeStyle = C.windowFrame;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(wx + ww / 2, wy + 8); ctx.lineTo(wx + ww / 2, wy + wh - 8);
      ctx.moveTo(wx + 8, wy + wh / 2); ctx.lineTo(wx + ww - 8, wy + wh / 2);
      ctx.stroke();
    }

    return { update: update, render: render, reset: reset };
  })();

  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  //  PLAYER module (cat drawing, animation, hitbox)
  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  var Player = (function() {
    function getHitbox() {
      // Friendly hitboxes: 85% of visual size for forgiving gameplay
      if (catDucking && catOnGround) {
        return { x: CAT_X - 16, y: catY - 30, w: 34, h: 30 };
      }
      return { x: CAT_X - 16, y: catY - 51, w: 34, h: 51 };
    }

    function update(dt) {
      // Jump buffer countdown
      if (jumpBuffer > 0) jumpBuffer--;

      // Physics
      if (!catOnGround) {
        catVY += GRAVITY * (dt / FIXED_DT);
        catY  += catVY * (dt / FIXED_DT);
        if (catY >= GROUND_Y) {
          catY = GROUND_Y;
          catVY = 0;
          catOnGround = true;
          // Execute buffered jump
          if (jumpBuffer > 0) {
            jumpBuffer = 0;
            catVY = JUMP_VEL;
            catOnGround = false;
            catDucking = false;
          }
        }
      }
      if (gameState === 'PLAYING' && catOnGround && !catDucking) {
        runTimer += dt;
        while (runTimer >= RUN_MS) { runTimer -= RUN_MS; runFrame = (runFrame + 1) % 4; }
      }
    }

    function jump() {
      if (!catOnGround) { jumpBuffer = 6; return; } // buffer jump for near-landing
      catVY = JUMP_VEL;
      catOnGround = false;
      catDucking = false;
    }

    function setDuck(v) {
      catDucking = v && catOnGround;
    }

    function render(ctx) {
      ctx.save();
      var fx = CAT_X;                   // horizontal anchor
      var fy = catY;                    // feet Y
      var legOff = catOnGround && !catDucking ? LEG_OFFSETS[runFrame] : 0;

      // Draw normal running/jumping cat (skip when ducking)
      if (!(catDucking && catOnGround)) {
      ctx.strokeStyle = C.catBody; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fx - 16, fy - 28);
      ctx.bezierCurveTo(fx - 50, fy - 50, fx - 50, fy - 85, fx - 30, fy - 75);
      ctx.stroke();
      logDraw('cat-tail', {x:fx-35, y:fy-65, w:0, h:0, color:C.catBody});

      ctx.fillStyle = C.catLeg;
      ctx.fillRect(fx + 2,  fy - 22 + legOff, 6, 22);
      ctx.fillRect(fx + 10, fy - 24 - legOff, 6, 24);
      logDraw('cat-leg', {x:fx+6, y:fy-16+legOff, w:12, h:24, color:C.catLeg});

      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.ellipse(fx, fy - 30, 18, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      logDraw('cat-body', {x:fx-18, y:fy-46, w:36, h:32, color:C.catBody});
      ctx.fillStyle = C.catBelly;
      ctx.beginPath();
      ctx.ellipse(fx + 2, fy - 27, 10, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = C.catLeg;
      ctx.fillRect(fx - 16, fy - 24 + legOff, 6, 24);
      ctx.fillRect(fx - 6,  fy - 26 - legOff, 6, 26);

      var hcy = fy - 55;
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.arc(fx + 4, hcy, 13, 0, Math.PI * 2);
      ctx.fill();
      logDraw('cat-head', {x:fx-9, y:hcy-13, w:26, h:26, color:C.catBody});

      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.moveTo(fx - 6, hcy - 8); ctx.lineTo(fx - 12, hcy - 26); ctx.lineTo(fx + 2, hcy - 8);
      ctx.fill();
      ctx.fillStyle = C.catInnerEar;
      ctx.beginPath();
      ctx.moveTo(fx - 4, hcy - 9); ctx.lineTo(fx - 9, hcy - 22); ctx.lineTo(fx, hcy - 9);
      ctx.fill();
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.moveTo(fx + 4, hcy - 10); ctx.lineTo(fx + 10, hcy - 28); ctx.lineTo(fx + 14, hcy - 8);
      ctx.fill();
      ctx.fillStyle = C.catInnerEar;
      ctx.beginPath();
      ctx.moveTo(fx + 6, hcy - 10); ctx.lineTo(fx + 10, hcy - 24); ctx.lineTo(fx + 12, hcy - 9);
      ctx.fill();

      ctx.fillStyle = C.catEye;
      ctx.beginPath();
      ctx.arc(fx - 2, hcy - 4, 2.5, 0, Math.PI * 2);
      ctx.arc(fx + 12, hcy - 4, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.catHighlight;
      ctx.beginPath();
      ctx.arc(fx - 1, hcy - 5, 1, 0, Math.PI * 2);
      ctx.arc(fx + 13, hcy - 5, 1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = C.catNose;
      ctx.beginPath();
      ctx.moveTo(fx + 4, hcy - 1); ctx.lineTo(fx + 8, hcy - 1); ctx.lineTo(fx + 6, hcy + 2);
      ctx.fill();

      ctx.strokeStyle = C.catEye; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(fx - 8, hcy - 1); ctx.lineTo(fx - 22, hcy - 3);
      ctx.moveTo(fx - 8, hcy + 1); ctx.lineTo(fx - 22, hcy + 1);
      ctx.moveTo(fx + 14, hcy - 2); ctx.lineTo(fx + 28, hcy - 4);
      ctx.moveTo(fx + 14, hcy); ctx.lineTo(fx + 28, hcy);
      ctx.stroke();

      if (!catOnGround) {
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.arc(fx - 8, hcy - 12, 4, 0, Math.PI * 2);
        ctx.arc(fx + 14, hcy - 12, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      } // end normal cat drawing

      if (catDucking && catOnGround) {
        // Tail (lowered, flat)
        ctx.strokeStyle = C.catBody; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(fx - 16, fy - 20);
        ctx.bezierCurveTo(fx - 45, fy - 28, fx - 40, fy - 18, fx - 28, fy - 22);
        ctx.stroke();
        logDraw('cat-tail', {x:fx-35, y:fy-24, w:0, h:0, color:C.catBody});
        // Back legs (tucked)
        ctx.fillStyle = C.catLeg;
        ctx.fillRect(fx + 3,  fy - 14, 5, 14);
        ctx.fillRect(fx + 10, fy - 12, 5, 12);
        logDraw('cat-leg', {x:fx+6, y:fy-14, w:12, h:14, color:C.catLeg});
        // Compressed body
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.ellipse(fx, fy - 22, 20, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        logDraw('cat-body', {x:fx-20, y:fy-32, w:40, h:20, color:C.catBody});
        ctx.fillStyle = C.catBelly;
        ctx.beginPath();
        ctx.ellipse(fx + 2, fy - 20, 11, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        // Front legs (tucked)
        ctx.fillStyle = C.catLeg;
        ctx.fillRect(fx - 14, fy - 14, 5, 14);
        ctx.fillRect(fx - 5,  fy - 12, 5, 12);
        // Head lowered
        var dhcy = fy - 38;
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.arc(fx + 4, dhcy, 11, 0, Math.PI * 2);
        ctx.fill();
        logDraw('cat-head', {x:fx-7, y:dhcy-11, w:22, h:22, color:C.catBody});
        // Ears (flattened back)
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.moveTo(fx - 5, dhcy - 5); ctx.lineTo(fx - 14, dhcy - 14); ctx.lineTo(fx + 2, dhcy - 6);
        ctx.fill();
        ctx.fillStyle = C.catInnerEar;
        ctx.beginPath();
        ctx.moveTo(fx - 4, dhcy - 6); ctx.lineTo(fx - 11, dhcy - 13); ctx.lineTo(fx - 1, dhcy - 7);
        ctx.fill();
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.moveTo(fx + 3, dhcy - 7); ctx.lineTo(fx + 12, dhcy - 16); ctx.lineTo(fx + 13, dhcy - 5);
        ctx.fill();
        ctx.fillStyle = C.catInnerEar;
        ctx.beginPath();
        ctx.moveTo(fx + 5, dhcy - 7); ctx.lineTo(fx + 10, dhcy - 14); ctx.lineTo(fx + 11, dhcy - 6);
        ctx.fill();
        logDraw('cat-ear', {x:fx-8, y:dhcy-14, w:20, h:14, color:C.catBody});
        // Eyes lowered
        ctx.fillStyle = C.catEye;
        ctx.beginPath();
        ctx.arc(fx, dhcy - 4, 2.5, 0, Math.PI * 2);
        ctx.arc(fx + 10, dhcy - 4, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = C.catHighlight;
        ctx.beginPath();
        ctx.arc(fx + 1, dhcy - 5, 1, 0, Math.PI * 2);
        ctx.arc(fx + 11, dhcy - 5, 1, 0, Math.PI * 2);
        ctx.fill();
        // Nose
        ctx.fillStyle = C.catNose;
        ctx.beginPath();
        ctx.moveTo(fx + 4, dhcy - 1); ctx.lineTo(fx + 8, dhcy - 1); ctx.lineTo(fx + 6, dhcy + 2);
        ctx.fill();
        logDraw('cat-nose', {x:fx+4, y:dhcy-1, w:4, h:3, color:C.catNose, extra:'duck'});
        // Whiskers (shorter, stressed)
        ctx.strokeStyle = C.catEye; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(fx - 6, dhcy - 1); ctx.lineTo(fx - 18, dhcy - 2);
        ctx.moveTo(fx - 6, dhcy + 1); ctx.lineTo(fx - 18, dhcy + 1);
        ctx.moveTo(fx + 13, dhcy - 2); ctx.lineTo(fx + 24, dhcy - 3);
        ctx.moveTo(fx + 13, dhcy); ctx.lineTo(fx + 24, dhcy);
        ctx.stroke();
        logDraw('cat-whisker', {x:fx-18, y:dhcy-2, w:42, h:3, color:C.catEye, extra:'duck'});
      }

      ctx.restore();
    }

    function isOnGround() { return catOnGround; }

    function reset() {
      catY = GROUND_Y; catVY = 0; catOnGround = true;
      catDucking = false; runFrame = 0; runTimer = 0;
    }

    return { update: update, render: render, jump: jump, setDuck: setDuck,
             getHitbox: getHitbox, isOnGround: isOnGround, reset: reset };
  })();

  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  //  OBSTACLE MANAGER module
  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  var ObstacleManager = (function() {
    var spawnTimer = 0;
    var nextSpawn  = 0;
    var pool = [];                   // pre-populated obstacle objects
    var active = [];                 // active references

    // Pre-allocate pool of 6 obstacle objects
    function initPool() {
      pool = [];
      for (var i = 0; i < 6; i++) {
        pool.push({ type: null, x: 0, active: false });
      }
    }

    function acquire(type) {
      for (var i = 0; i < pool.length; i++) {
        if (!pool[i].active) {
          pool[i].type = type;
          pool[i].x = W;
          pool[i].active = true;
          active.push(pool[i]);
          return;
        }
      }
    }

    function recycle(obs) {
      obs.active = false;
      var idx = active.indexOf(obs);
      if (idx !== -1) active.splice(idx, 1);
    }

    function randomType() {
      // Bias toward short obstacles at higher speeds (encourages duck mechanic)
      var speedRatio = gameSpeed / BASE_SPEED;
      var shortChance = speedRatio > 2.5 ? 0.7 : (speedRatio > 1.5 ? 0.6 : 0.33);
      var roll = Math.random();
      if (roll < shortChance) {
        // Pick a short obstacle (indices 3,4,5)
        return 3 + Math.floor(Math.random() * 3);
      }
      // Pick a tall obstacle (indices 0,1,2)
      return Math.floor(Math.random() * 3);
    }

    function update(dt) {
      if (gameState !== 'PLAYING') return;

      // Speed ramp
      elapsedTime += dt;
      gameSpeed = Math.min(BASE_SPEED * (1 + SPEED_RAMP * (elapsedTime / 10000)), SPEED_CAP);

      // Spawn
      spawnTimer += dt;
      if (spawnTimer >= nextSpawn && active.length < MAX_OBSTACLES) {
        spawnTimer = 0;
        nextSpawn = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
        acquire(randomType());
      }

      // Move & recycle
      for (var i = active.length - 1; i >= 0; i--) {
        var obs = active[i];
        obs.x -= gameSpeed * (dt / FIXED_DT);
        if (obs.x < -OBSTACLES[obs.type].w - 10) {
          recycle(obs);
        }
      }
    }

    function render(ctx) {
      for (var i = 0; i < active.length; i++) {
        var obs = active[i];
        var def = OBSTACLES[obs.type];
        var y = def.short ? 200 : GROUND_Y;
        def.draw(ctx, obs.x, y);
        logDraw('obs-' + def.name, {x:obs.x, y:y - def.h, w:def.w, h:def.h});
        // Debug hitbox (uncomment to visualize):
        // var hb = getHitbox(obs);
        // ctx.strokeStyle='red'; ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);
      }
    }

    function getHitbox(obs) {
      var def = OBSTACLES[obs.type];
      // Friendly hitboxes: 85% of visual, centered
      var fw = Math.round(def.w * 0.85);
      var fh = Math.round(def.h * 0.85);
      var fx = obs.x + Math.round((def.w - fw) / 2);
      if (def.short) {
        return { x: fx, y: 200 - fh, w: fw, h: fh };
      }
      return { x: fx, y: GROUND_Y - fh, w: fw, h: fh };
    }

    function getActive() { return active; }

    function reset() {
      for (var i = active.length - 1; i >= 0; i--) recycle(active[i]);
      spawnTimer = 0;
      nextSpawn = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
      elapsedTime = 0;
      gameSpeed = BASE_SPEED;
    }

    initPool();

    return { update: update, render: render, getActive: getActive, getHitbox: getHitbox,
             recycle: recycle, reset: reset };
  })();

  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  //  DOG module
  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  var Dog = (function() {
    function advance() {
      dogX = DOG_POSITIONS[Math.min(damageCount, 3)];
      if (damageCount === 0) dogState = 'idle';
      else if (damageCount === 1) dogState = 'advancing';
      else dogState = 'lunging';
    }

    function render(ctx) {
      if (gameState === 'READY') return;  // intro scene draws its own dog

      var dx = dogX;
      var dy = GROUND_Y;
      var legPhase = (dogState === 'advancing' || dogState === 'lunging') ? (Date.now() % 200 < 100 ? 3 : 0) : 0;

      ctx.save();
      ctx.translate(dx, dy);

      // Tail
      ctx.strokeStyle = C.dogDark; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-18, -28);
      ctx.bezierCurveTo(-35, -38, -38, -55, -30, -60);
      ctx.stroke();
      logDraw('dog-tail', {x:dx-35, y:dy-50, w:0, h:0, color:C.dogDark});

      // Back legs
      ctx.fillStyle = C.dogDark;
      ctx.fillRect(-14, -16 - legPhase, 7, 16);
      ctx.fillRect(-4, -18 + legPhase, 7, 18);
      logDraw('dog-leg', {x:dx-14, y:dy-16-legPhase, w:28, h:18, color:C.dogDark});

      // Body (larger than cat: 28×20 vs cat's 18×16)
      ctx.fillStyle = C.dogBody;
      ctx.beginPath();
      ctx.ellipse(0, -28, 28, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      logDraw('dog-body', {x:dx-28, y:dy-48, w:56, h:40, color:C.dogBody});
      // Belly
      ctx.fillStyle = C.dogDark;
      ctx.beginPath();
      ctx.ellipse(2, -24, 18, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // Front legs
      ctx.fillStyle = C.dogDark;
      ctx.fillRect(6, -16 - legPhase, 7, 16);
      ctx.fillRect(16, -18 + legPhase, 7, 18);

      // Head
      ctx.fillStyle = C.dogBody;
      ctx.beginPath();
      ctx.arc(24, -44, 16, 0, Math.PI * 2);
      ctx.fill();
      logDraw('dog-head', {x:dx+8, y:dy-60, w:32, h:32, color:C.dogBody});

      // Floppy ears
      ctx.fillStyle = C.dogDark;
      ctx.beginPath();
      ctx.ellipse(12, -44, 7, 14, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(34, -44, 7, 14, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Snout
      ctx.fillStyle = C.dogBody;
      ctx.beginPath();
      ctx.ellipse(38, -40, 12, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath();
      ctx.arc(20, -48, 2.5, 0, Math.PI * 2);
      ctx.arc(32, -48, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(19, -49, 1, 0, Math.PI * 2);
      ctx.arc(31, -49, 1, 0, Math.PI * 2);
      ctx.fill();

      // Nose
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(48, -42, 3, 0, Math.PI * 2);
      ctx.fill();

      // Mouth / teeth
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(44, -38);
      ctx.lineTo(48, -36);
      ctx.stroke();

      // Tongue (lunging)
      if (dogState === 'lunging') {
        ctx.fillStyle = C.dogTongue;
        ctx.beginPath();
        ctx.ellipse(48, -30, 3, 7, 0.2, 0, Math.PI * 2);
        ctx.fill();
        // Drool
        ctx.fillStyle = 'rgba(255,107,107,0.5)';
        ctx.beginPath();
        ctx.arc(49, -24, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function reset() {
      dogX = DOG_BASE_X;
      dogState = 'idle';
      damageCount = 0;
    }

    return { advance: advance, render: render, reset: reset };
  })();

  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  //  INPUT module
  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  var Input = (function() {
    var escPressed = false;
    var rPressed = false;
    function isJumpKey(e)  { return e.code === 'Space' || e.code === 'ArrowUp'  || e.code === 'KeyW'; }
    function isDuckKey(e)  { return e.code === 'ArrowDown' || e.code === 'KeyS'; }

    function onKeyDown(e) {
      if (e.code === 'Escape') { escPressed = true; e.preventDefault(); return; }
      if (e.code === 'KeyR') { rPressed = true; anyKey = true; e.preventDefault(); return; }
      if (isJumpKey(e)) { jumpKey = true; anyKey = true; e.preventDefault(); }
      if (isDuckKey(e)) { duckKey = true; anyKey = true; e.preventDefault(); }
      if (e.code === 'Space') e.preventDefault();
    }

    function onKeyUp(e) {
      if (isJumpKey(e)) jumpKey = false;
      if (isDuckKey(e)) duckKey = false;
    }

    function onTouchStart(e) {
      e.preventDefault();
      anyKey = true;
      var rect = canvas.getBoundingClientRect();
      var scaleY = H / rect.height;
      var touchY = (e.touches[0].clientY - rect.top) * scaleY;
      if (touchY < H / 2) { jumpKey = true; } else { duckKey = true; }
    }

    function onTouchEnd(e) {
      e.preventDefault();
      jumpKey = false;
      duckKey = false;
    }

    function poll() {
      // Rising-edge jump
      jumpEdge = jumpKey && !jumpEdge;
      if (jumpEdge && gameState === 'PLAYING') Player.jump();
      Player.setDuck(duckKey && Player.isOnGround());
    }

    function consumePause() {
      var v = escPressed;
      escPressed = false;
      return v;
    }

    function consumeRestart() {
      var v = rPressed;
      rPressed = false;
      return v;
    }

    function consumeAnyKey() {
      var v = anyKey;
      anyKey = false;
      return v;
    }

    function init() {
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      canvas.addEventListener('touchstart', onTouchStart, { passive: false });
      canvas.addEventListener('touchend', onTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', onTouchEnd);
      canvas.addEventListener('click', function() { anyKey = true; });
    }

    return { init: init, poll: poll, consumeAnyKey: consumeAnyKey, consumePause: consumePause, consumeRestart: consumeRestart };
  })();

  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  //  GAME module (state machine + loop orchestration)
  // ÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉÔòÉ
  var Game = (function() {
    var lastTime = 0;
    var accumulator = 0;
    var fontScale = 1;
    var LS_KEY = 'catRunnerHighScore';

    function loadHighScore() {
      try { highScore = parseInt(localStorage.getItem(LS_KEY), 10) || 0; }
      catch(e) { highScore = 0; }
    }

    function saveHighScore() {
      if (score > highScore) {
        highScore = Math.floor(score);
        try { localStorage.setItem(LS_KEY, String(highScore)); }
        catch(e) { /* storage full, silently ignore */ }
      }
    }

    function transition() {
      if (gameState === 'READY') {
        // Update intro animation
        if (introPhase === 'idle') {
          // Bounce yarn ball
          introYarnVY += GRAVITY * 0.5;
          if (introYarnVY > 6) introYarnVY = -5;
          introYarnX += 0.3;
          if (introYarnX > 440) introYarnX = 420;
          // Dog peeks in gradually
          dogX = Math.min(dogX + 0.4, -20);
        }
        // Start game on key/tap
        if (Input.consumeAnyKey()) {
          introPhase = 'bolting';
          introTimer = 0;
        }
      }

      if (gameState === 'READY' && introPhase === 'bolting') {
        introTimer += FIXED_DT;
        // Cat bolts from center to game position over 500ms
        introCatX = 400 - (400 - CAT_X) * Math.min(introTimer / 500, 1);
        // Dog retreats off-screen
        dogX = -20 - 80 * Math.min(introTimer / 500, 1);
        if (introTimer >= 500) {
          gameState = 'PLAYING';
          catY = GROUND_Y; catOnGround = true; catVY = 0;
          introPhase = 'idle';
          introCatX = CAT_X;
          ObstacleManager.reset();
          Dog.reset();
        }
      }

      if (gameState === 'GAME_OVER' && Input.consumeAnyKey() && deathTimer <= 0) {
        gameState = 'READY';
        resetAll();
      }

      // Pause toggle / restart
      if (Input.consumePause()) {
        if (gameState === 'PLAYING') {
          gameState = 'PAUSED';
        } else if (gameState === 'PAUSED') {
          gameState = 'PLAYING';
        }
      }
      if (gameState === 'PAUSED' && Input.consumeRestart()) {
        gameState = 'READY';
        resetAll();
      }
    }

    function resetAll() {
      gameState    = 'READY';
      gameSpeed    = BASE_SPEED;
      damageCount  = 0;
      invulnTimer  = 0;
      stumbleTimer = 0;
      deathTimer   = 0;
      score        = 0;
      introPhase   = 'idle';
      introTimer   = 0;
      introCatX    = 400;
      introYarnX   = 420;
      introYarnVY  = 0;
      dogX         = DOG_BASE_X;
      dogState     = 'idle';
      catY = GROUND_Y; catVY = 0; catOnGround = true;
      catDucking = false; runFrame = 0; runTimer = 0; jumpBuffer = 0;
      windowOffset = 0;
      Background.reset();
      ObstacleManager.reset();
      Dog.reset();
    }

    function aabbCollision(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function checkCollisions() {
      if (invulnTimer > 0) return;

      var catHb = Player.getHitbox();
      var activeObs = ObstacleManager.getActive();

      for (var i = 0; i < activeObs.length; i++) {
        var obsHb = ObstacleManager.getHitbox(activeObs[i]);
        if (!aabbCollision(catHb, obsHb)) continue;

        var def = OBSTACLES[activeObs[i].type];
        if (def.short && catDucking) continue;

        handleHit();
        ObstacleManager.recycle(activeObs[i]);
        break;
      }
    }

    function handleHit() {
      damageCount++;
      invulnTimer = INVULN_MS;
      stumbleTimer = 3;

      catY = GROUND_Y;
      catVY = 0;
      catOnGround = true;

      Dog.advance();

      if (damageCount >= 3) {
        gameState = 'GAME_OVER';
        deathTimer = 60; // ~1s cooldown before restart allowed
        // Clear ALL sticky input to prevent instant restart
        anyKey = false;
        jumpKey = false;
        duckKey = false;
        saveHighScore();
      }
    }

    function updateFontScale() {
      fontScale = Math.min(canvas.width / W, canvas.height / H);
    }

    function loop(ts) {
      var dt = ts - lastTime;
      lastTime = ts;
      if (dt > DT_CAP) dt = DT_CAP;
      if (dt <= 0) { requestAnimationFrame(loop); return; }

      updateFontScale();

      accumulator += dt;
      while (accumulator >= FIXED_DT) {
        transition();
        if (gameState === 'PLAYING') {
          Input.poll();
          Player.update(FIXED_DT);
          ObstacleManager.update(FIXED_DT);
          Background.update(FIXED_DT);
          score += gameSpeed * FIXED_DT / 10;
          if (invulnTimer > 0) { invulnTimer -= FIXED_DT; if (invulnTimer < 0) invulnTimer = 0; }
          if (stumbleTimer > 0) stumbleTimer--;
          checkCollisions();
        }
        accumulator -= FIXED_DT;
      }
    }

    function renderFrame() {
      updateFontScale();
      ctx.clearRect(0, 0, W, H);
      if (DEBUG) { drawLog = []; }
      Background.render(ctx);

      if (gameState === 'PLAYING' || gameState === 'GAME_OVER') {
        ObstacleManager.render(ctx);
      }

      // Cat rendering
      if (gameState === 'PLAYING' || gameState === 'GAME_OVER') {
        var catAlpha = 1;
        if (invulnTimer > 0) {
          catAlpha = (Math.floor(invulnTimer / BLINK_MS) % 2 === 0) ? 0.4 : 1.0;
        }
        ctx.globalAlpha = catAlpha;

        if (stumbleTimer > 0 && gameState === 'PLAYING') {
          ctx.save();
          ctx.translate(CAT_X, GROUND_Y);
          ctx.rotate(15 * Math.PI / 180);
          ctx.translate(-CAT_X, -GROUND_Y);
          Player.render(ctx);
          // X eyes
          ctx.strokeStyle = '#FF0000';
          ctx.lineWidth = 1.5;
          var ey = GROUND_Y - 55;
          ctx.beginPath();
          ctx.moveTo(CAT_X - 3, ey - 5); ctx.lineTo(CAT_X, ey - 2);
          ctx.moveTo(CAT_X, ey - 5); ctx.lineTo(CAT_X - 3, ey - 2);
          ctx.moveTo(CAT_X + 11, ey - 5); ctx.lineTo(CAT_X + 14, ey - 2);
          ctx.moveTo(CAT_X + 14, ey - 5); ctx.lineTo(CAT_X + 11, ey - 2);
          ctx.stroke();
          ctx.fillStyle = '#FFD700';
          for (var s2 = 0; s2 < 3; s2++) {
            var sx2 = CAT_X - 20 + s2 * 25;
            var sy2 = ey - 12 + (s2 % 2) * 6;
            drawStar(ctx, sx2, sy2, 4);
          }
          ctx.restore();
        } else {
          Player.render(ctx);
        }
        ctx.globalAlpha = 1;

        Dog.render(ctx);
      }

      // Intro scene (READY)
      if (gameState === 'READY') {
        renderIntroScene(ctx);
      }

      // Capture draw log for debug
      if (DEBUG) { lastFrameDrawLog = drawLog.slice(); frameCount++; }

      // HUD and overlays
      renderHUD(ctx);
      renderStateOverlay(ctx);

      // Debug overlay (DOM, visible in browser snapshot — only in debug mode)
      if (DEBUG) {
        var dbg = document.getElementById('debug');
        dbg.style.display = 'block';
      dbg.innerText = 'state:' + gameState +
        ' | obs:' + ObstacleManager.getActive().length +
        ' | catY:' + catY.toFixed(1) +
        ' | duck:' + catDucking +
        ' | onGround:' + catOnGround +
        ' | speed:' + gameSpeed.toFixed(1) +
        ' | dmg:' + damageCount +
        ' | dogX:' + dogX.toFixed(0) +
        ' | dogState:' + dogState +
        ' | invuln:' + invulnTimer.toFixed(0) +
        ' | score:' + Math.floor(score);
      }
    }

    function loop(ts) {
      var dt = ts - lastTime;
      lastTime = ts;
      if (dt > DT_CAP) dt = DT_CAP;
      if (dt <= 0) { requestAnimationFrame(loop); return; }

      accumulator += dt;
      while (accumulator >= FIXED_DT) {
        transition();
        if (deathTimer > 0) deathTimer--;
        if (gameState === 'PLAYING') {
          Input.poll();
          Player.update(FIXED_DT);
          ObstacleManager.update(FIXED_DT);
          Background.update(FIXED_DT);
          score += gameSpeed * FIXED_DT / 10;
          if (invulnTimer > 0) { invulnTimer -= FIXED_DT; if (invulnTimer < 0) invulnTimer = 0; }
          if (stumbleTimer > 0) stumbleTimer--;
          checkCollisions();
        }
        accumulator -= FIXED_DT;
      }

      renderFrame();
      requestAnimationFrame(loop);
    }

    // Intro scene: cat at center, yarn ball, dog peeking
    function renderIntroScene(ctx) {
      var cx = introCatX;
      var cy = GROUND_Y;

      ctx.save();

      // Draw intro cat at its animated position
      ctx.save();
      ctx.translate(cx, cy);

      // Tail
      ctx.strokeStyle = C.catBody; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-16, -28);
      ctx.bezierCurveTo(-50, -50, -45, -85, -30, -75);
      ctx.stroke();

      // Body
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.ellipse(0, -30, 18, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.catBelly;
      ctx.beginPath();
      ctx.ellipse(2, -27, 10, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Legs
      ctx.fillStyle = C.catLeg;
      ctx.fillRect(-16, -24, 6, 24);
      ctx.fillRect(-6, -26, 6, 26);
      ctx.fillRect(2, -22, 6, 22);
      ctx.fillRect(10, -24, 6, 24);

      // Head
      var hcy = -55;
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.arc(4, hcy, 13, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.moveTo(-6, hcy - 8); ctx.lineTo(-12, hcy - 26); ctx.lineTo(2, hcy - 8); ctx.fill();
      ctx.fillStyle = C.catInnerEar;
      ctx.beginPath();
      ctx.moveTo(-4, hcy - 9); ctx.lineTo(-9, hcy - 22); ctx.lineTo(0, hcy - 9); ctx.fill();
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.moveTo(4, hcy - 10); ctx.lineTo(10, hcy - 28); ctx.lineTo(14, hcy - 8); ctx.fill();
      ctx.fillStyle = C.catInnerEar;
      ctx.beginPath();
      ctx.moveTo(6, hcy - 10); ctx.lineTo(10, hcy - 24); ctx.lineTo(12, hcy - 9); ctx.fill();

      // Eyes
      ctx.fillStyle = C.catEye;
      ctx.beginPath();
      ctx.arc(-2, hcy - 4, 2.5, 0, Math.PI * 2);
      ctx.arc(12, hcy - 4, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(-1, hcy - 5, 1, 0, Math.PI * 2);
      ctx.arc(13, hcy - 5, 1, 0, Math.PI * 2);
      ctx.fill();

      // Nose
      ctx.fillStyle = C.catNose;
      ctx.beginPath();
      ctx.moveTo(4, hcy - 1); ctx.lineTo(8, hcy - 1); ctx.lineTo(6, hcy + 2); ctx.fill();

      // Whiskers
      ctx.strokeStyle = C.catEye; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-8, hcy - 1); ctx.lineTo(-22, hcy - 3);
      ctx.moveTo(-8, hcy + 1); ctx.lineTo(-22, hcy + 1);
      ctx.moveTo(14, hcy - 2); ctx.lineTo(28, hcy - 4);
      ctx.moveTo(14, hcy); ctx.lineTo(28, hcy);
      ctx.stroke();

      ctx.restore(); // end cat translate

      // Yarn ball (bouncing below cat)
      var yarnX = introYarnX;
      var yarnY = GROUND_Y - 6 + introYarnVY * 0.5; // use velocity directly for visual offset

      ctx.fillStyle = '#E87080';
      ctx.beginPath();
      ctx.arc(yarnX, yarnY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#D06070';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(yarnX, yarnY, 6, 0, Math.PI * 2);
      ctx.stroke();
      // Yarn thread
      ctx.strokeStyle = '#E87080';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(yarnX + 3, yarnY - 3);
      ctx.quadraticCurveTo(yarnX + 10, yarnY - 10, yarnX + 8, yarnY);
      ctx.stroke();

      // Dog peeking from left
      if (dogX < 0 && dogX > -120) {
        var dx2 = dogX;
        ctx.save();
        ctx.translate(dx2, GROUND_Y);

        // Body (partial, peeking)
        ctx.fillStyle = C.dogDark;
        ctx.beginPath();
        ctx.ellipse(8, -16, 18, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = C.dogBody;
        ctx.beginPath();
        ctx.arc(22, -30, 13, 0, Math.PI * 2);
        ctx.fill();

        // Ear
        ctx.fillStyle = C.dogDark;
        ctx.beginPath();
        ctx.ellipse(14, -30, 6, 11, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // Snout
        ctx.fillStyle = C.dogBody;
        ctx.beginPath();
        ctx.ellipse(33, -26, 9, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eye
        ctx.fillStyle = '#1A1A1A';
        ctx.beginPath();
        ctx.arc(20, -32, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(19, -33, 0.8, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(40, -27, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();
    }

    // HUD: score and high score
    function renderHUD(ctx) {
      if (gameState !== 'PLAYING' && gameState !== 'GAME_OVER') return;

      ctx.save();
      var fs = Math.round(16 * fontScale);
      ctx.font = fs + 'px monospace';
      ctx.textAlign = 'right';
      ctx.fillStyle = C.text;

      var scoreText = 'Score: ' + Math.floor(score);
      ctx.fillText(scoreText, W - 15, 25);

      if (highScore > 0) {
        ctx.fillStyle = 'rgba(74,55,40,0.6)';
        ctx.font = (fs - 2) + 'px monospace';
        ctx.fillText('Best: ' + Math.floor(highScore), W - 15, 45);
      }

      ctx.restore();
    }

    // State overlays and mobile hints
    function renderStateOverlay(ctx) {
      ctx.save();

      if (gameState === 'READY') {
        // Prompt text
        var fs2 = Math.round(18 * fontScale);
        ctx.font = fs2 + 'px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = C.text;
        ctx.fillText('Press Space or Tap to Start', W / 2, H / 2 + 40);

        // Mobile touch hints
        if (isMobile) {
          ctx.globalAlpha = 0.5;
          ctx.font = Math.round(14 * fontScale) + 'px monospace';
          ctx.fillText('\u2191 Jump', W / 2, H / 4);
          ctx.fillText('\u2193 Duck', W / 2, H * 3 / 4 + 10);
          ctx.globalAlpha = 1;
        }
      }

      if (gameState === 'PAUSED') {
        // Dim overlay
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);

        var fsP = Math.round(26 * fontScale);
        ctx.font = 'bold ' + fsP + 'px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('PAUSED', W / 2, H / 2 - 20);

        var fsP2 = Math.round(14 * fontScale);
        ctx.font = fsP2 + 'px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillText('ESC to resume', W / 2, H / 2 + 10);
        ctx.fillText('R to restart', W / 2, H / 2 + 30);
      }

      if (gameState === 'GAME_OVER') {
        // Dim overlay
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(0, 0, W, H);

        // Game Over title
        var fs3 = Math.round(28 * fontScale);
        ctx.font = 'bold ' + fs3 + 'px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('Game Over', W / 2, H / 2 - 30);

        // Score
        var fs4 = Math.round(18 * fontScale);
        ctx.font = fs4 + 'px monospace';
        ctx.fillStyle = '#F4C478';
        ctx.fillText('Score: ' + Math.floor(score), W / 2, H / 2 + 5);

        // High score
        ctx.font = Math.round(14 * fontScale) + 'px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('Best: ' + Math.floor(highScore), W / 2, H / 2 + 30);

        // Retry prompt
        ctx.font = Math.round(16 * fontScale) + 'px monospace';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('Tap or press any key to retry', W / 2, H / 2 + 55);
      }

      ctx.restore();
    }

    function drawStar(ctx, x, y, r) {
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r * 0.4, y - r * 0.4);
      ctx.lineTo(x + r, y);
      ctx.lineTo(x + r * 0.4, y + r * 0.4);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - r * 0.4, y + r * 0.4);
      ctx.lineTo(x - r, y);
      ctx.lineTo(x - r * 0.4, y - r * 0.4);
      ctx.closePath();
      ctx.fill();
    }

    loadHighScore();

    return { loop: loop, resetAll: resetAll, transition: transition, checkCollisions: checkCollisions, renderFrame: renderFrame };
  })();

  // ÔöÇÔöÇ Boot ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
  isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  Input.init();
  requestAnimationFrame(Game.loop);

  (function() {
    var btn = document.getElementById('mute-btn');
    var SVG_ON  = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
    var SVG_OFF = '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
    function updateBtn() { btn.innerHTML = Sound.isMuted() ? SVG_OFF : SVG_ON; }
    btn.addEventListener('click', function(e) { e.stopPropagation(); Sound.toggleMute(); updateBtn(); });
    updateBtn();
  })();


})();
</script>
