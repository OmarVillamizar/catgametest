<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cat Runner</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas {
  display: block;
  width: 100vw; height: 100vh;
  object-fit: contain;
  touch-action: none;
  image-rendering: pixelated;
  -webkit-user-select: none;
  user-select: none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var W = 800, H = 300;
  canvas.width = W; canvas.height = H;

  var GROUND_Y    = 240;
  var FIXED_DT    = 16.667;
  var DT_CAP      = 100;
  var CAT_X       = 150;
  var JUMP_VEL    = -12;
  var GRAVITY     = 0.6;
  var BASE_SPEED  = 3;
  var SPEED_RAMP  = 0.08;
  var SPEED_CAP   = 9;
  var INVULN_MS   = 800;
  var BLINK_MS    = 100;
  var MAX_OBSTACLES = 3;
  var SPAWN_MIN   = 1200;
  var SPAWN_MAX   = 3000;
  var MIN_GAP     = 300;
  var DOG_BASE_X  = -100;
  var DOG_POSITIONS = [-100, 60, 150, 240];

  var OBSTACLES = [
    { name:'vase',  w:22, h:50, short:false,
      draw:function(ctx,x,y){ ctx.fillStyle='#C8B078'; ctx.fillRect(x+7,y-40,19,40);
        ctx.beginPath(); ctx.ellipse(x+16,y-40,11,6,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#B09860'; ctx.fillRect(x+3,y-8,25,8); } },
    { name:'lamp',  w:18, h:55, short:false,
      draw:function(ctx,x,y){ ctx.fillStyle='#8B6F47'; ctx.fillRect(x+6,y-48,4,48);
        ctx.beginPath(); ctx.arc(x+8,y-2,8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#E8D8A0'; ctx.beginPath(); ctx.moveTo(x+2,y-52); ctx.lineTo(x+14,y-52);
        ctx.lineTo(x+12,y-42); ctx.lineTo(x+4,y-42); ctx.closePath(); ctx.fill(); } },
    { name:'chair', w:35, h:45, short:false,
      draw:function(ctx,x,y){ ctx.fillStyle='#A07848';
        ctx.fillRect(x+2,y-8,4,8); ctx.fillRect(x+29,y-8,4,8);
        ctx.fillRect(x+2,y-45,35,5); ctx.fillRect(x+2,y-45,4,22);
        ctx.fillStyle='#8B6B3E'; ctx.fillRect(x+6,y-12,23,4); } },
    { name:'toy',   w:24, h:30, short:true,
      draw:function(ctx,x,y){ ctx.fillStyle='#E87080';
        ctx.beginPath(); ctx.arc(x+12,y-15,12,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2; ctx.beginPath();
        ctx.arc(x+12,y-15,12,-0.3,1.5); ctx.stroke();
        ctx.fillStyle='#FFF'; ctx.beginPath(); ctx.arc(x+16,y-18,3,0,Math.PI*2); ctx.fill(); } },
    { name:'basket',w:28, h:30, short:true,
      draw:function(ctx,x,y){ ctx.fillStyle='#C49460';
        ctx.beginPath(); ctx.moveTo(x+6,y-12); ctx.lineTo(x+22,y-12);
        ctx.lineTo(x+18,y-26); ctx.lineTo(x+10,y-26); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#A07040'; ctx.lineWidth=1;
        for(var i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+6+i*4,y-12);
          ctx.lineTo(x+8+i*4,y-26); ctx.stroke(); } } },
    { name:'plant', w:30, h:45, short:true,
      draw:function(ctx,x,y){ ctx.fillStyle='#B07040';
        ctx.fillRect(x+8,y-12,14,12);
        ctx.fillStyle='#60A040';
        ctx.beginPath(); ctx.ellipse(x+6,y-18,6,10,-0.3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+24,y-20,7,11,0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+15,y-30,6,12,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+15,y-22,5,8,0,0,Math.PI*2);
        ctx.fillStyle='#80C060'; ctx.fill(); } }
  ];

  var C = {
    wall:        '#F0E4D8', wallPattern: '#E8D8C8',
    floor:       '#C4A882', floorDark:    '#B89870', floorLine: '#A88868',
    baseboard:   '#8B7355', windowFrame:  '#D4B896', windowGlass: '#B5D8E8',
    catBody:     '#E8923A', catStripe:    '#D47A2A', catBelly: '#F4C478',
    catInnerEar: '#F0B0B0', catEye:       '#2D2D2D', catNose: '#E87080',
    catLeg:      '#D48030', catHighlight: '#FFFFFF',
    dogBody:     '#8B6F47', dogDark:      '#6B5230', dogTongue: '#FF6B6B',
    text:        '#4A3728'
  };

  var gameState    = 'READY';
  var gameSpeed    = BASE_SPEED;
  var floorOffset  = 0;
  var elapsedTime  = 0;
  var damageCount  = 0;
  var invulnTimer  = 0;
  var dogX         = DOG_BASE_X;
  var dogState     = 'idle';
  var stumbleTimer = 0;

  var catY        = GROUND_Y;
  var catVY       = 0;
  var catOnGround = true;
  var catDucking  = false;
  var runFrame    = 0;
  var runTimer    = 0;
  var RUN_MS      = 100;
  var LEG_OFFSETS = [0, -3, -2, -1];

  var jumpKey  = false;
  var duckKey  = false;
  var anyKey   = false;
  var jumpEdge = false;

  var Background = (function() {
    var SEGMENT_W = 810;
    var PLANK_W = 135, PLANK_H = 60;

    function update(dt) {
      if (gameState !== 'PLAYING') return;
      floorOffset = (floorOffset + gameSpeed * 0.6 * dt / FIXED_DT) % SEGMENT_W;
    }

    function render(ctx) {
      ctx.fillStyle = C.wall;
      ctx.fillRect(0, 0, W, 232);
      ctx.fillStyle = C.wallPattern;
      for (var x = 20; x < W; x += 40)
        for (var y = 20; y < 232; y += 40)
          ctx.fillRect(x, y, 2, 2);
      // Window
      var wx = 620, wy = 60, ww = 100, wh = 130;
      ctx.fillStyle = C.windowFrame;
      ctx.fillRect(wx, wy, ww, wh);
      ctx.fillStyle = C.windowGlass;
      ctx.fillRect(wx + 8, wy + 8, ww - 16, wh - 16);
      ctx.strokeStyle = C.windowFrame; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(wx + ww / 2, wy + 8); ctx.lineTo(wx + ww / 2, wy + wh - 8);
      ctx.moveTo(wx + 8, wy + wh / 2); ctx.lineTo(wx + ww - 8, wy + wh / 2);
      ctx.stroke();
      // Baseboard
      ctx.fillStyle = C.baseboard;
      ctx.fillRect(0, 232, W, 8);
      // Floor
      for (var seg = -1; seg <= 1; seg++) {
        var segX = seg * SEGMENT_W - floorOffset;
        for (var i = 0; i < 6; i++) {
          var px = segX + i * PLANK_W;
          ctx.fillStyle = (i % 2 === 0) ? C.floor : C.floorDark;
          ctx.fillRect(px, GROUND_Y, PLANK_W, PLANK_H);
          ctx.strokeStyle = C.floorLine; ctx.lineWidth = 1;
          ctx.strokeRect(px, GROUND_Y, PLANK_W, PLANK_H);
        }
      }
    }

    function reset() { floorOffset = 0; }
    return { update: update, render: render, reset: reset };
  })();

  var Player = (function() {
    function getHitbox() {
      if (catDucking && catOnGround) return { x: CAT_X - 18, y: 204, w: 40, h: 36 };
      return { x: CAT_X - 18, y: 180, w: 40, h: 60 };
    }

    function update(dt) {
      if (!catOnGround) {
        catVY += GRAVITY * (dt / FIXED_DT);
        catY  += catVY * (dt / FIXED_DT);
        if (catY >= GROUND_Y) { catY = GROUND_Y; catVY = 0; catOnGround = true; }
      }
      if (gameState === 'PLAYING' && catOnGround && !catDucking) {
        runTimer += dt;
        while (runTimer >= RUN_MS) { runTimer -= RUN_MS; runFrame = (runFrame + 1) % 4; }
      }
    }

    function jump() {
      if (!catOnGround) return;
      catVY = JUMP_VEL; catOnGround = false; catDucking = false;
    }

    function setDuck(v) { catDucking = v && catOnGround; }

    function render(ctx) {
      ctx.save();
      var fx = CAT_X, fy = catY;
      var legOff = catOnGround && !catDucking ? LEG_OFFSETS[runFrame] : 0;

      ctx.strokeStyle = C.catBody; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fx - 16, fy - 28);
      ctx.bezierCurveTo(fx - 50, fy - 50, fx - 50, fy - 85, fx - 30, fy - 75);
      ctx.stroke();

      ctx.fillStyle = C.catLeg;
      ctx.fillRect(fx + 2,  fy - 22 + legOff, 6, 22);
      ctx.fillRect(fx + 10, fy - 24 - legOff, 6, 24);

      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.ellipse(fx, fy - 30, 18, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.catBelly;
      ctx.beginPath();
      ctx.ellipse(fx + 2, fy - 27, 10, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = C.catLeg;
      ctx.fillRect(fx - 16, fy - 24 + legOff, 6, 24);
      ctx.fillRect(fx - 6,  fy - 26 - legOff, 6, 26);

      var hcy = fy - 55;
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.arc(fx + 4, hcy, 13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.moveTo(fx - 6, hcy - 8); ctx.lineTo(fx - 12, hcy - 26); ctx.lineTo(fx + 2, hcy - 8); ctx.fill();
      ctx.fillStyle = C.catInnerEar;
      ctx.beginPath();
      ctx.moveTo(fx - 4, hcy - 9); ctx.lineTo(fx - 9, hcy - 22); ctx.lineTo(fx, hcy - 9); ctx.fill();
      ctx.fillStyle = C.catBody;
      ctx.beginPath();
      ctx.moveTo(fx + 4, hcy - 10); ctx.lineTo(fx + 10, hcy - 28); ctx.lineTo(fx + 14, hcy - 8); ctx.fill();
      ctx.fillStyle = C.catInnerEar;
      ctx.beginPath();
      ctx.moveTo(fx + 6, hcy - 10); ctx.lineTo(fx + 10, hcy - 24); ctx.lineTo(fx + 12, hcy - 9); ctx.fill();

      ctx.fillStyle = C.catEye;
      ctx.beginPath();
      ctx.arc(fx - 2, hcy - 4, 2.5, 0, Math.PI * 2);
      ctx.arc(fx + 12, hcy - 4, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.catHighlight;
      ctx.beginPath();
      ctx.arc(fx - 1, hcy - 5, 1, 0, Math.PI * 2);
      ctx.arc(fx + 13, hcy - 5, 1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = C.catNose;
      ctx.beginPath();
      ctx.moveTo(fx + 4, hcy - 1); ctx.lineTo(fx + 8, hcy - 1); ctx.lineTo(fx + 6, hcy + 2);
      ctx.fill();

      ctx.strokeStyle = C.catEye; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(fx - 8, hcy - 1); ctx.lineTo(fx - 22, hcy - 3);
      ctx.moveTo(fx - 8, hcy + 1); ctx.lineTo(fx - 22, hcy + 1);
      ctx.moveTo(fx + 14, hcy - 2); ctx.lineTo(fx + 28, hcy - 4);
      ctx.moveTo(fx + 14, hcy); ctx.lineTo(fx + 28, hcy);
      ctx.stroke();

      if (!catOnGround) {
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.arc(fx - 8, hcy - 12, 4, 0, Math.PI * 2);
        ctx.arc(fx + 14, hcy - 12, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      if (catDucking && catOnGround) {
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.ellipse(fx, fy - 22, 20, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = C.catBelly;
        ctx.beginPath();
        ctx.ellipse(fx + 2, fy - 20, 11, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = C.catBody;
        ctx.beginPath();
        ctx.arc(fx + 4, fy - 38, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = C.catEye;
        ctx.beginPath();
        ctx.arc(fx, fy - 40, 2, 0, Math.PI * 2);
        ctx.arc(fx + 10, fy - 40, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function isOnGround() { return catOnGround; }
    function reset() { catY = GROUND_Y; catVY = 0; catOnGround = true; catDucking = false; runFrame = 0; runTimer = 0; }
    return { update: update, render: render, jump: jump, setDuck: setDuck, getHitbox: getHitbox, isOnGround: isOnGround, reset: reset };
  })();

  var ObstacleManager = (function() {
    var spawnTimer = 0, nextSpawn = 0, lastSpawnX = W;
    var pool = [], active = [];

    function initPool() {
      pool = [];
      for (var i = 0; i < 6; i++) pool.push({ type: null, x: 0, active: false });
    }

    function acquire(type) {
      for (var i = 0; i < pool.length; i++) {
        if (!pool[i].active) {
          pool[i].type = type; pool[i].x = W; pool[i].active = true;
          active.push(pool[i]); lastSpawnX = W; return;
        }
      }
    }

    function recycle(obs) {
      obs.active = false;
      var idx = active.indexOf(obs);
      if (idx !== -1) active.splice(idx, 1);
    }

    function randomType() { return Math.floor(Math.random() * OBSTACLES.length); }

    function canSpawn() { return active.length < MAX_OBSTACLES && (W - lastSpawnX) >= MIN_GAP; }

    function update(dt) {
      if (gameState !== 'PLAYING') return;
      elapsedTime += dt;
      gameSpeed = Math.min(BASE_SPEED * (1 + SPEED_RAMP * (elapsedTime / 10000)), SPEED_CAP);
      spawnTimer += dt;
      if (spawnTimer >= nextSpawn) {
        spawnTimer = 0;
        nextSpawn = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
        if (canSpawn()) acquire(randomType());
      }
      for (var i = active.length - 1; i >= 0; i--) {
        var obs = active[i];
        obs.x -= gameSpeed * (dt / FIXED_DT);
        if (obs.x < -OBSTACLES[obs.type].w - 10) recycle(obs);
      }
    }

    function render(ctx) {
      for (var i = 0; i < active.length; i++) {
        var obs = active[i], def = OBSTACLES[obs.type];
        var y = def.short ? 200 : GROUND_Y;
        def.draw(ctx, obs.x, y);
      }
    }

    function getHitbox(obs) {
      var def = OBSTACLES[obs.type];
      if (def.short) return { x: obs.x, y: 200 - def.h, w: def.w, h: def.h };
      return { x: obs.x, y: GROUND_Y - def.h, w: def.w, h: def.h };
    }

    function getActive() { return active; }

    function reset() {
      for (var i = active.length - 1; i >= 0; i--) recycle(active[i]);
      spawnTimer = 0;
      nextSpawn = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
      elapsedTime = 0; gameSpeed = BASE_SPEED;
    }

    initPool();
    return { update: update, render: render, getActive: getActive, getHitbox: getHitbox, recycle: recycle, reset: reset };
  })();

  var Dog = (function() {
    function advance() {
      dogX = DOG_POSITIONS[Math.min(damageCount, 3)];
      dogState = damageCount === 0 ? 'idle' : damageCount === 1 ? 'advancing' : 'lunging';
    }

    function render(ctx) {
      if (gameState === 'READY') return;
      var dx = dogX, dy = GROUND_Y;
      ctx.save(); ctx.translate(dx, dy);

      ctx.fillStyle = C.dogBody;
      ctx.beginPath(); ctx.ellipse(0, -16, 22, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.dogBody;
      ctx.beginPath(); ctx.arc(20, -28, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.dogDark;
      ctx.beginPath();
      ctx.ellipse(10, -34, 6, 12, -0.4, 0, Math.PI * 2);
      ctx.ellipse(28, -34, 6, 12, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.dogBody;
      ctx.fillRect(30, -32, 10, 8);
      ctx.fillStyle = '#2D2D2D';
      ctx.beginPath();
      ctx.arc(16, -30, 2, 0, Math.PI * 2); ctx.arc(26, -30, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(15, -31, 0.8, 0, Math.PI * 2); ctx.arc(25, -31, 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath(); ctx.arc(36, -30, 2.5, 0, Math.PI * 2); ctx.fill();
      if (dogState === 'lunging') {
        ctx.fillStyle = C.dogTongue;
        ctx.beginPath(); ctx.ellipse(38, -24, 3, 6, 0.15, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = C.dogDark;
      ctx.fillRect(-12, -4, 6, 20); ctx.fillRect(-2, -4, 6, 20);
      ctx.fillRect(8, -4, 6, 20); ctx.fillRect(18, -4, 6, 20);

      ctx.restore();
    }

    function reset() { dogX = DOG_BASE_X; dogState = 'idle'; damageCount = 0; }
    return { advance: advance, render: render, reset: reset };
  })();
    function isJumpKey(e)  { return e.code === 'Space' || e.code === 'ArrowUp'  || e.code === 'KeyW'; }
    function isDuckKey(e)  { return e.code === 'ArrowDown' || e.code === 'KeyS'; }

    function onKeyDown(e) {
      if (isJumpKey(e)) { jumpKey = true; anyKey = true; e.preventDefault(); }
      if (isDuckKey(e)) { duckKey = true; anyKey = true; e.preventDefault(); }
      if (e.code === 'Space') e.preventDefault();
    }

    function onKeyUp(e) {
      if (isJumpKey(e)) jumpKey = false;
      if (isDuckKey(e)) duckKey = false;
    }

    function onTouchStart(e) {
      e.preventDefault();
      anyKey = true;
      var rect = canvas.getBoundingClientRect();
      var scaleY = H / rect.height;
      var touchY = (e.touches[0].clientY - rect.top) * scaleY;
      if (touchY < H / 2) jumpKey = true; else duckKey = true;
    }

    function onTouchEnd(e) { e.preventDefault(); jumpKey = false; duckKey = false; }

    function poll() {
      jumpEdge = jumpKey && !jumpEdge;
      if (jumpEdge && gameState === 'PLAYING') Player.jump();
      Player.setDuck(duckKey && Player.isOnGround());
    }

    function consumeAnyKey() { var v = anyKey; anyKey = false; return v; }

    function init() {
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      canvas.addEventListener('touchstart', onTouchStart, { passive: false });
      canvas.addEventListener('touchend', onTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', onTouchEnd);
    }

    return { init: init, poll: poll, consumeAnyKey: consumeAnyKey };
  })();

  var Game = (function() {
    var lastTime = 0;
    var accumulator = 0;

    function transition() {
      if (gameState === 'READY' && Input.consumeAnyKey()) { gameState = 'PLAYING'; ObstacleManager.reset(); Dog.reset(); }
      if (gameState === 'GAME_OVER' && Input.consumeAnyKey()) { gameState = 'READY'; resetAll(); }
    }

    function resetAll() {
      gameState = 'READY'; gameSpeed = BASE_SPEED;
      damageCount = 0; invulnTimer = 0; stumbleTimer = 0;
      catY = GROUND_Y; catVY = 0; catOnGround = true; catDucking = false; runFrame = 0; runTimer = 0;
      Background.reset(); ObstacleManager.reset(); Dog.reset();
    }

    function aabbCollision(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function checkCollisions() {
      if (invulnTimer > 0) return;
      var catHb = Player.getHitbox();
      var activeObs = ObstacleManager.getActive();
      for (var i = 0; i < activeObs.length; i++) {
        var obsHb = ObstacleManager.getHitbox(activeObs[i]);
        if (!aabbCollision(catHb, obsHb)) continue;
        var def = OBSTACLES[activeObs[i].type];
        if (def.short && catDucking) continue;
        handleHit();
        ObstacleManager.recycle(activeObs[i]);
        break;
      }
    }

    function handleHit() {
      damageCount++; invulnTimer = INVULN_MS; stumbleTimer = 3;
      catY = GROUND_Y; catVY = 0; catOnGround = true;
      Dog.advance();
      if (damageCount >= 3) gameState = 'GAME_OVER';
    }

    function loop(ts) {
      var dt = ts - lastTime;
      lastTime = ts;
      if (dt > DT_CAP) dt = DT_CAP;
      if (dt <= 0) { requestAnimationFrame(loop); return; }

      accumulator += dt;
      while (accumulator >= FIXED_DT) {
        transition();
        if (gameState === 'PLAYING') {
          Input.poll(); Player.update(FIXED_DT);
          ObstacleManager.update(FIXED_DT); Background.update(FIXED_DT);
          if (invulnTimer > 0) { invulnTimer -= FIXED_DT; if (invulnTimer < 0) invulnTimer = 0; }
          if (stumbleTimer > 0) stumbleTimer--;
          checkCollisions();
        }
        accumulator -= FIXED_DT;
      }

      ctx.clearRect(0, 0, W, H);
      Background.render(ctx); ObstacleManager.render(ctx);

      var catAlpha = 1;
      if (invulnTimer > 0) catAlpha = (Math.floor(invulnTimer / BLINK_MS) % 2 === 0) ? 0.4 : 1.0;
      ctx.globalAlpha = catAlpha;

      if (stumbleTimer > 0 && gameState === 'PLAYING') {
        ctx.save();
        ctx.translate(CAT_X, GROUND_Y); ctx.rotate(15 * Math.PI / 180); ctx.translate(-CAT_X, -GROUND_Y);
        Player.render(ctx);
        ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 1.5;
        var ey = GROUND_Y - 55;
        ctx.beginPath();
        ctx.moveTo(CAT_X - 3, ey - 5); ctx.lineTo(CAT_X, ey - 2);
        ctx.moveTo(CAT_X, ey - 5); ctx.lineTo(CAT_X - 3, ey - 2);
        ctx.moveTo(CAT_X + 11, ey - 5); ctx.lineTo(CAT_X + 14, ey - 2);
        ctx.moveTo(CAT_X + 14, ey - 5); ctx.lineTo(CAT_X + 11, ey - 2);
        ctx.stroke();
        ctx.fillStyle = '#FFD700';
        for (var s = 0; s < 3; s++) {
          var sx = CAT_X - 20 + s * 25, sy = ey - 12 + (s % 2) * 6;
          ctx.beginPath();
          ctx.moveTo(sx, sy - 4); ctx.lineTo(sx + 1.6, sy - 1.6); ctx.lineTo(sx + 4, sy);
          ctx.lineTo(sx + 1.6, sy + 1.6); ctx.lineTo(sx, sy + 4);
          ctx.lineTo(sx - 1.6, sy + 1.6); ctx.lineTo(sx - 4, sy);
          ctx.lineTo(sx - 1.6, sy - 1.6); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      } else {
        Player.render(ctx);
      }
      ctx.globalAlpha = 1;

      Dog.render(ctx);

      if (gameState === 'READY') {
        ctx.fillStyle = C.text; ctx.font = '18px monospace'; ctx.textAlign = 'center';
        ctx.fillText('Press Space or Tap to Start', W / 2, H / 2 + 20);
      }
      if (gameState === 'GAME_OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = C.text; ctx.font = '24px monospace'; ctx.textAlign = 'center';
        ctx.fillText('Game Over', W / 2, H / 2 - 10);
        ctx.font = '16px monospace'; ctx.fillText('Tap or press any key to retry', W / 2, H / 2 + 20);
      }

      requestAnimationFrame(loop);
    }

    return { loop: loop, resetAll: resetAll };
  })();

  Input.init();
  requestAnimationFrame(Game.loop);
})();
</script>
